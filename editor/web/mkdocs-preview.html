<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>MkDocsプレビュー</title>
<style>body{font:16px/1.8 "Yu Gothic UI",sans-serif;max-width:850px;margin:70px auto;padding:24px;color:#283b43}pre{white-space:pre-wrap;background:#f4f7f7;padding:20px}</style>
<h1>MkDocsプレビューを起動中…</h1><p>出力済みのサイトを開きます。エディターで「サイト用に出力」すると、プレビューにも反映されます。</p><pre hidden></pre>
<script>
fetch('/api/start-preview',{method:'POST',headers:{'Content-Type':'application/json','X-Glossary-Editor':'1'},body:'{}'})
.then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error);location.replace(data.url);})
.catch(error=>{document.querySelector('h1').textContent='MkDocsを起動できませんでした';const detail=document.querySelector('pre');detail.hidden=false;detail.textContent=error.message;});
</script></html>
